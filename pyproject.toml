[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kami"
version = "0.1.0"
description = "Agent-based discrete-event simulator for evaluating ride-hailing policies with Common Random Numbers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []   # the core runs on the standard library only

[project.optional-dependencies]
fast = ["numpy", "scipy"]                  # Hungarian matching, exact t-quantiles
geo = ["pyproj"]                           # lon/lat of road networks (H3 zones, lon/lat CSV replay)
cpp = ["cython", "setuptools"]             # build the C++ road router: python -m kami.network.road.cpp.build
h3 = ["h3"]
data = ["pandas", "pyarrow"]               # DataFrame / Parquet export of the event log
store = ["pyarrow"]                        # Parquet event logs of stored runs (kami.store, run --spec)
osm = ["osmium", "pyproj", "h3"]           # build road networks from OSM: python -m kami.osm build hanoi

service = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.35; python_version < '3.10'", "uvicorn>=0.30,<0.41; python_version >= '3.10'"]
service-test = ["fastapi>=0.115,<0.129", "uvicorn>=0.30,<0.35; python_version < '3.10'", "uvicorn>=0.30,<0.41; python_version >= '3.10'", "httpx>=0.27,<0.29"]

[project.scripts]
kami = "kami.cli:main"

[tool.setuptools.packages.find]
include = ["kami*"]

[tool.setuptools.package-data]
"kami.network.road" = ["LICENSE-FleetPy"]
"kami.network.road.cpp" = ["*.cpp", "*.h", "*.pyx", "*.pxd"]

"kami.store" = ["migrations/*.sql"]
